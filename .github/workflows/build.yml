name: Build KytyPS5 Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018
  BOX64_COMMIT: eb49d3d97f3a21844f903d99dca80dec7add36bd

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (full history for git version embedding)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          ls "$ANDROID_HOME/ndk"

      - name: Install native toolchain (clang, lld, glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld glslang-tools ninja-build
          clang --version
          glslangValidator --version | head -2

      - name: Bridge protocol integration test (native, host-side)
        run: |
          bash scripts/run-bridge-tests.sh

      - name: Build box64 (ARM64 Android, dynarec)
        run: |
          bash scripts/android-build-box64.sh \
            "$GITHUB_WORKSPACE" \
            "$ANDROID_HOME/ndk/$NDK_VERSION" \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libbox64.so"

      - name: Verify NDK path
        run: |
          test -x "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" && echo "NDK toolchain OK"

      - name: Build kyty_emulator (x86_64 + Android bridge)
        run: |
          bash scripts/android-build-emulator.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/_Build/android-bridge" \
            "$GITHUB_WORKSPACE/app/src/main/assets/kyty/bin/kyty_emulator"

      - name: Build x86_64 rootfs (Debian runtime libraries)
        run: |
          bash scripts/android-make-rootfs.sh \
            "$GITHUB_WORKSPACE/app/src/main/assets/kyty/rootfs.tar.gz"

      - name: Write runtime version marker
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "runtime-v1-${SHA}" > app/src/main/assets/kyty/runtime_version.txt
          cat app/src/main/assets/kyty/runtime_version.txt
          echo "--- assets summary ---"
          du -h app/src/main/assets/kyty/bin/kyty_emulator \
                 app/src/main/assets/kyty/rootfs.tar.gz \
                 app/src/main/jniLibs/arm64-v8a/libbox64.so

      - name: Gradle wrapper permissions
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/KytyPS5-Android-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/KytyPS5-Android-release-unsigned.apk || \
            cp app/build/outputs/apk/release/app-release.apk output/KytyPS5-Android-release-unsigned.apk
          ls -la output/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Android-debug
          path: output/KytyPS5-Android-debug.apk
          if-no-files-found: error

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Android-release-unsigned
          path: output/KytyPS5-Android-release-unsigned.apk
          if-no-files-found: error

      - name: Upload runtime report
        if: always()
        run: |
          {
            echo "## KytyPS5 Android build"
            echo
            echo "- commit: $(git rev-parse HEAD)"
            echo "- box64: ${BOX64_COMMIT} (ARM64 dynarec)"
            echo "- kyty_emulator: x86_64 clang Release, Android bridge"
            echo "- rootfs: Debian amd64 minimal"
          } > build-report.md

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          if-no-files-found: warn
